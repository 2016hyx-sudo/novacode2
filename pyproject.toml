[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "novacode"
version = "0.1.0"
description = "A small, understandable, hackable coding agent harness"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.30",
    "anthropic>=0.34",
    "rich>=13.0",
]

[project.scripts]
novacode = "main:main"

[tool.setuptools]
py-modules = ["main", "config", "demo"]

[tool.setuptools.packages.find]
include = ["coding_agent*", "evals*"]

[tool.ruff.lint]
ignore = ["BLE001"]
